version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    ports:
      - "3001:3000"
    environment:
      SERVICE_PORT: "3000"
      DATABASE_URL: "postgres://orderflow:orderflow@postgres:5432/order_db"
      INVENTORY_SERVICE_URL: "http://inventory-service:3000"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3000"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "3002:3000"
    environment:
      SERVICE_PORT: "3000"
      DATABASE_URL: "postgres://orderflow:orderflow@postgres:5432/inventory_db"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  customer-service:
    build: ./services/customer-service
    ports:
      - "3003:3000"
    environment:
      SERVICE_PORT: "3000"
      DATABASE_URL: "postgres://orderflow:orderflow@postgres:5432/customer_db"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-service:
    build: ./services/notification-service
    ports:
      - "3004:3000"
    environment:
      SERVICE_PORT: "3000"
      DATABASE_URL: "postgres://orderflow:orderflow@postgres:5432/notification_db"
      LOG_LEVEL: "info"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz/ready"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: