name: OrderFlow CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, customer-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install deps
        working-directory: services/${{ matrix.service }}
        run: npm ci
      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [order-service, inventory-service, customer-service, notification-service]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_STAGING }}
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          for s in order-service inventory-service customer-service notification-service; do
            kubectl apply -f k8s/$s/
          done
          kubectl apply -f k8s/ingress.yaml
      - name: Set GHCR images
        run: |
          PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          SHA="${{ github.sha }}"
          for s in order-service inventory-service customer-service notification-service; do
            kubectl -n orderflow set image deployment/$s $s=$PREFIX/$s:$SHA
          done
      - name: Verify rollout
        run: |
          for s in order-service inventory-service customer-service notification-service; do
            kubectl rollout status deployment/$s -n orderflow --timeout=120s
          done

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG_PRODUCTION }}
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secrets.yaml
          for s in order-service inventory-service customer-service notification-service; do
            kubectl apply -f k8s/$s/
          done
          kubectl apply -f k8s/ingress.yaml
      - name: Set GHCR images
        run: |
          PREFIX="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}"
          SHA="${{ github.sha }}"
          for s in order-service inventory-service customer-service notification-service; do
            kubectl -n orderflow set image deployment/$s $s=$PREFIX/$s:$SHA
          done
      - name: Verify rollout
        run: |
          for s in order-service inventory-service customer-service notification-service; do
            kubectl rollout status deployment/$s -n orderflow --timeout=120s
          done
